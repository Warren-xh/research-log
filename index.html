<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>科研日志</title>
<meta name="description" content="每天的科研进度记录">
<meta name="theme-color" content="#eef3f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a20" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23234a9b'/%3E%3Cpath d='M9 6v20' stroke='%23e0476e' stroke-width='2'/%3E%3Cpath d='M13 11h11M13 16h11M13 21h7' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script>
  try {
    const t = localStorage.getItem("rl-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch {}
</script>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" id="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18" class="brand-margin"/><path d="M9.5 8h9M9.5 12h9M9.5 16h6"/></svg>
      <span id="brandName">科研日志</span>
    </a>
    <nav class="topnav" aria-label="主导航">
      <a href="#/" data-nav="home">日志</a>
      <a href="#/week" data-nav="week">周报</a>
      <a href="#/settings" data-nav="settings">设置</a>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="切换明暗主题" title="切换明暗主题">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button type="button" class="lock-btn" id="lockBtn"></button>
    </nav>
  </div>
</header>
<main id="main" tabindex="-1"><p class="loading">正在打开日志…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog"></dialog>
<script type="module" src="js/app.mjs"></script>
</body>
</html>
